{% extends 'base.html' %}

{% block content %}
<style>
    .password-card {
        border-radius: 28px;
        border: none;
        overflow: hidden;
        box-shadow: 0 15px 35px rgba(0, 51, 102, 0.1);
        margin: 60px 0;
    }
    .password-header {
        background: linear-gradient(135deg, #002B54, #003366);
        padding: 1rem 1.8rem;
        border-bottom: 3px solid #FF9933;
    }
    .password-header h4 {
        font-weight: 600;
        letter-spacing: 0.5px;
        margin: 0;
        color: white;
    }
    .btn-ir-change {
        background: #FF9933;
        border: none;
        border-radius: 40px;
        padding: 12px;
        font-weight: bold;
        font-size: 1rem;
        transition: 0.2s;
        color: #001F3F;
    }
    .btn-ir-change:hover {
        background: #E65C00;
        transform: translateY(-2px);
        color: white;
        box-shadow: 0 6px 12px rgba(255,102,0,0.3);
    }
    .form-label {
        font-weight: 500;
        font-size: 0.9rem;
        color: #1e3a5f;
    }
    .form-control {
        border-radius: 20px;
        border: 1px solid #CED4DA;
        padding: 10px 16px;
    }
    .form-control:focus {
        border-color: #FF9933;
        box-shadow: 0 0 0 0.2rem rgba(255,153,51,0.25);
    }
</style>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card password-card shadow">
                <div class="password-header">
                    <h4><i class="fas fa-key me-2"></i> Change Password</h4>
                    <small class="text-white-50">Secure your RailConnect account</small>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label"><i class="fas fa-lock me-1"></i> Old Password</label>
                            <input type="password" class="form-control" name="old_password" placeholder="Enter current password" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label"><i class="fas fa-key me-1"></i> New Password</label>
                            <input type="password" class="form-control" name="new_password" placeholder="Create new password" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label"><i class="fas fa-check-circle me-1"></i> Confirm New Password</label>
                            <input type="password" class="form-control" name="confirm_password" placeholder="Re-enter new password" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-ir-change"><i class="fas fa-save me-1"></i> Update Password</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
